# In the <VirtualHost *:443> of the site the page is on (dev.whirlinggizmo.com), so the
# page's haxelib/ path goes to the nginx mirror (haxelib-mirror.conf.template). PAGE_DIR is
# where play.html is served from: "/haxe/" if it's https://dev.whirlinggizmo.com/haxe/play.html.
# mod_proxy and mod_proxy_http are already enabled there; Apache passes the visitor's
# address on (X-Forwarded-For), which the mirror's rate limit uses.

ProxyPass        PAGE_DIRhaxelib/files/3.0/ http://127.0.0.1:10080/files/3.0/
ProxyPassReverse PAGE_DIRhaxelib/files/3.0/ http://127.0.0.1:10080/files/3.0/
