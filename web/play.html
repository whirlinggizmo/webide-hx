<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haxe hot reload in a page</title>
<style>
  :root { --bg: #fafafa; --fg: #111; --muted: #666; --line: #ddd; --panel: #fff; --accent: #0b6bcb; --hover: #eef3fa; --error: #c62828; }
  /* dark: the system's, unless Preferences say light; or Preferences say dark */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161616; --fg: #e6e6e6; --muted: #999; --line: #333; --panel: #1e1e1e; --accent: #5aa9ff; --hover: #26303c; --error: #ff8a80; } }
  :root[data-theme="dark"] { --bg: #161616; --fg: #e6e6e6; --muted: #999; --line: #333; --panel: #1e1e1e; --accent: #5aa9ff; --hover: #26303c; --error: #ff8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { position: relative; display: flex; gap: 12px; align-items: center; padding: 8px 16px 8px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  /* a build in progress: a spinner by the status, and a bar along the header's foot */
  .spinner { display: none; width: 12px; height: 12px; margin-right: -6px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  body.busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; visibility: hidden; }
  body.busy #progress { visibility: visible; }
  #progress div { height: 100%; width: 0; background: var(--accent); transition: width 0.1s linear; }
  #progress.guess div { width: 30%; transition: none; animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } #progress.guess div { animation: none; width: 100%; opacity: 0.4; } }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  header .status { color: var(--muted); font-size: 13px; }
  header .where { margin-left: auto; color: var(--muted); font-size: 13px; }
  /* the menus: a button in the header, its items in a list below it */
  .menus { display: flex; gap: 2px; }
  .menu { position: relative; }
  .menubutton { border-color: transparent; background: transparent; }
  .menubutton:hover, .menubutton[aria-expanded="true"] { background: var(--hover); }
  .items { position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; display: flex; flex-direction: column; min-width: 220px; padding: 4px 0;
           background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); }
  .items[hidden] { display: none; }
  .items button { border: 0; border-radius: 0; text-align: left; padding: 5px 14px; background: transparent; }
  .items button:hover, .items button:focus-visible, .items button:focus { background: var(--hover); outline: none; }
  .items button:disabled { color: var(--muted); background: transparent; cursor: default; }
  .items hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .items button { display: flex; gap: 24px; }
  .items kbd { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); }
  .items button[hidden] { display: none; }
  /* the page's own dialog: a question, or a name to type */
  dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg);
           box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog form { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
  dialog h2 { margin: 0; font-size: 15px; }
  dialog p { margin: 0; }
  dialog p:empty, dialog ul:empty { display: none; }
  dialog ul { margin: 0; padding: 6px 10px 6px 26px; max-height: 160px; overflow: auto; background: var(--bg); border-radius: 4px; font: 12px/1.5 ui-monospace, monospace; }
  dialog input { font: 13px ui-monospace, monospace; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  dialog input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  dialog .error { color: var(--error); font-size: 13px; }
  /* OK first in the form, so Enter picks it; shown on the right */
  dialog .actions { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 4px; }
  dialog .actions .danger { border-color: var(--error); color: var(--error); }
  #prefs { width: min(500px, calc(100vw - 32px)); }
  #prefs .grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; }
  #prefs select, #prefs input[type=number] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); justify-self: start; }
  #prefs input[type=number] { width: 70px; }
  #prefs .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  #prefs label.check { display: flex; gap: 6px; align-items: center; }
  #prefs .actions { justify-content: flex-start; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 4px; cursor: pointer; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 3fr 2fr; gap: 1px; background: var(--line); height: calc(100vh - 46px); }
  section { background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .code { display: grid; grid-template-columns: 180px 1fr; min-height: 0; flex: 1; }
  .files { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #tree { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1; font-size: 13px; }
  #tree .folder { color: var(--muted); }
  #tree .caret { width: 12px; flex: none; font-size: 10px; line-height: 19px; }
  #tree button.drop { background-color: var(--hover); box-shadow: inset 0 0 0 1px var(--accent); }
  #tree button { display: flex; gap: 4px; width: 100%; border: 0; border-radius: 0; text-align: left; padding: 3px 10px 3px 8px; background-color: transparent; }
  #tree button:hover { background-color: var(--hover); }
  #tree button.on { background-color: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
  #tree .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tree .count { margin-left: 6px; font-size: 11px; color: var(--error); }
  .edit { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #editor .cm-editor.cm-focused { outline: none; }
  #editor .cm-scroller { font-family: ui-monospace, monospace; line-height: 1.45; }
  iframe { flex: 1; border: 0; background: var(--panel); min-height: 0; }
  #out { margin: 0; padding: 6px 8px; max-height: 30%; overflow: auto; font: 12px/1.4 ui-monospace, monospace; border-top: 1px solid var(--line); color: var(--muted); white-space: pre-wrap; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 3fr 2fr; }
    .code { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); max-height: 140px; }
  }
</style>
</head>
<body>
<header>
  <h1 class="visually-hidden">Haxe, hot</h1>
  <nav class="menus">
    <div class="menu">
      <button class="menubutton" id="file-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="file-items">File</button>
      <div class="items" id="file-items" role="menu" aria-labelledby="file-menu" hidden>
        <button role="menuitem" id="new" title="src/... for code, anything else is an asset">New file…</button>
        <button role="menuitem" id="new-folder">New folder…</button>
        <hr role="separator">
        <button role="menuitem" id="rename">Rename…</button>
        <button role="menuitem" id="delete">Delete…</button>
      </div>
    </div>
    <div class="menu">
      <button class="menubutton" id="edit-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="edit-items">Edit</button>
      <div class="items" id="edit-items" role="menu" aria-labelledby="edit-menu" hidden>
        <button role="menuitem" id="undo">Undo<kbd class="mod">Ctrl+Z</kbd></button>
        <button role="menuitem" id="redo">Redo<kbd class="mod">Ctrl+Shift+Z</kbd></button>
        <hr role="separator">
        <button role="menuitem" id="cut">Cut<kbd class="mod">Ctrl+X</kbd></button>
        <button role="menuitem" id="copy">Copy<kbd class="mod">Ctrl+C</kbd></button>
        <button role="menuitem" id="paste">Paste<kbd class="mod">Ctrl+V</kbd></button>
        <button role="menuitem" id="select-all">Select all<kbd class="mod">Ctrl+A</kbd></button>
        <hr role="separator">
        <button role="menuitem" id="find">Find…<kbd class="mod">Ctrl+F</kbd></button>
        <button role="menuitem" id="replace">Replace…</button>
        <button role="menuitem" id="goto-line">Go to line…<kbd class="mod">Ctrl+Alt+G</kbd></button>
        <hr role="separator">
        <button role="menuitem" id="comment">Toggle comment<kbd class="mod">Ctrl+/</kbd></button>
        <button role="menuitem" id="indent">Indent<kbd class="mod">Ctrl+]</kbd></button>
        <button role="menuitem" id="outdent">Outdent<kbd class="mod">Ctrl+[</kbd></button>
        <hr role="separator">
        <button role="menuitem" id="preferences">Preferences…</button>
      </div>
    </div>
    <div class="menu">
      <button class="menubutton" id="project-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="project-items">Project</button>
      <div class="items" id="project-items" role="menu" aria-labelledby="project-menu" hidden>
        <button role="menuitem" id="build-item">Build<kbd class="mod">Ctrl+S</kbd></button>
        <hr role="separator">
        <button role="menuitem" id="folder" title="work on a folder on this computer (Chromium browsers)" hidden>Open folder…</button>
        <button role="menuitem" id="import" title="a zip as the project kept in this browser, replacing it">Import zip…</button>
        <button role="menuitem" id="export">Export zip</button>
        <hr role="separator">
        <button role="menuitem" id="reset" title="back to the example, losing your changes">Reset to the example…</button>
      </div>
    </div>
  </nav>
  <button class="primary" id="build" title="Ctrl-S">Build</button>
  <span class="spinner" aria-hidden="true"></span>
  <span class="status" id="status" role="status">starting</span>
  <span class="where" id="where"></span>
  <input type="file" id="zipfile" accept=".zip,application/zip" hidden>
  <div id="progress"><div></div></div>
</header>
<dialog id="prefs" aria-labelledby="prefs-title">
  <form method="dialog">
    <h2 id="prefs-title">Preferences</h2>
    <div class="grid">
      <label for="pref-theme">Theme</label>
      <select id="pref-theme"><option value="system">As the system</option><option value="light">Light</option><option value="dark">Dark</option></select>
      <label for="pref-fontSize">Font size</label>
      <input type="number" id="pref-fontSize" min="9" max="28" step="1">
      <label for="pref-tabSize">Tab width</label>
      <select id="pref-tabSize"><option value="2">2</option><option value="4">4</option><option value="8">8</option></select>
      <label for="pref-indent">Indent with</label>
      <select id="pref-indent"><option value="tabs">Tabs</option><option value="spaces">Spaces</option></select>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="pref-wrap"> Wrap long lines</label>
      <label class="check"><input type="checkbox" id="pref-lineNumbers"> Line numbers</label>
      <label class="check"><input type="checkbox" id="pref-folding"> Folding</label>
      <label class="check"><input type="checkbox" id="pref-activeLine"> Highlight the current line</label>
      <label class="check"><input type="checkbox" id="pref-brackets"> Match brackets</label>
      <label class="check"><input type="checkbox" id="pref-closeBrackets"> Close brackets and quotes</label>
    </div>
    <div class="actions">
      <button value="ok" class="primary" id="prefs-done">Done</button>
      <button value="defaults" id="prefs-defaults" formnovalidate>Defaults</button>
    </div>
  </form>
</dialog>
<dialog id="dialog">
  <form method="dialog">
    <h2 id="dialog-title"></h2>
    <p id="dialog-text"></p>
    <ul id="dialog-list"></ul>
    <input id="dialog-input" autocomplete="off" spellcheck="false" aria-labelledby="dialog-title">
    <p class="error" id="dialog-error" role="alert"></p>
    <div class="actions">
      <button value="ok" id="dialog-ok" class="primary">OK</button>
      <button value="cancel" id="dialog-cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>
<main>
  <section>
    <div class="code">
      <div class="files">
        <ul id="tree"></ul>
      </div>
      <div class="edit">
        <div id="editor"></div>
        <pre id="out"></pre>
      </div>
    </div>
  </section>
  <section>
    <iframe id="run" title="the running program"></iframe>
  </section>
</main>
<script>
// A project of files: .hx files under src/ are the program (compiled in a worker by the
// in-page compiler), anything else is an asset, served to the program by the service
// worker (sw.js), which plays the DevServer's part for the frame on the right. Saving a
// .hx file, or adding, renaming or removing one, builds again (-D hotreload_reload after the
// first) and the program reloads; saving an asset tells the program it changed. The
// project's files are kept as they're edited: in the browser, or in a folder on this
// computer the person opened. The browser's project is, the first time and after Reset,
// hotreload-hx's examples/hello (copied to hello/ by build.py --hotreload).
const TESTING = location.search.includes("test");
const EXAMPLE = "hello/";
const MAIN = "Main", BUNDLE = "hello.js";
const HOTRELOAD = ["-cp", "/lib/hotreload/src", "/lib/hotreload/extraParams.hxml"];

const files = {}, saved = {};
let current = null, version = 0, reg = null;
// the editor (CodeMirror, web/vendor/codemirror.js): one view, a state per file, so each
// keeps its own undo history; the compiler's errors and warnings as each file's diagnostics
let CM = null, view = null;
const states = new Map(), diagnostics = new Map();
const $ = (id) => document.getElementById(id);
const status = (s) => { $("status").textContent = s; };
const out = (s) => { $("out").textContent = s; };
const names = () => Object.keys(files).sort();
const isCode = (name) => name.startsWith("src/") && name.endsWith(".hx");

// ---- the project's files, through ZenFS (vendor/fs.js, a node-like fs): kept in this
// browser (IndexedDB, mounted at /browser), or in a folder on this computer that the
// person opened (File System Access, mounted at /folder). A file is text, or its bytes (a
// Uint8Array) when it isn't UTF-8 text. Hidden files, node_modules and build outputs at the
// top (out/, bin/, build/, dump/) aren't part of the project, nor files over MAX_BYTES
let FS = null;
const SKIP = /(^|\/)(\.[^/]*|node_modules)(\/|$)|^(out|bin|build|dump)(\/|$)/;
const MAX_BYTES = 8 << 20;
const utf8 = new TextDecoder("utf-8", { fatal: true });
const isText = (data) => typeof data === "string";
function asData(bytes) {
  bytes = new Uint8Array(bytes);
  try { const text = utf8.decode(bytes); return text.includes("\0") ? bytes : text; } catch (e) { return bytes; }
}
const project = {
  root: "/browser",
  folder: null, // the open folder's handle; null when the project is the browser's
  path(name) { return this.root + "/" + name; },
  open() {
    return FS.configure({ mounts: { "/browser": { backend: FS.IndexedDB, storeName: TESTING ? "haxe-in-browser-test-project" : "haxe-in-browser-project" } } });
  },
  async useFolder(handle) {
    const mounted = await FS.resolveMountConfig({ backend: FS.WebAccess, handle });
    if (this.folder) FS.umount("/folder");
    FS.mount("/folder", mounted);
    this.root = "/folder"; this.folder = handle;
  },
  // a folder on disk, read again: ZenFS reads its whole tree when it's mounted and doesn't
  // see what changes outside the page after (another editor, git), so whatever works on a
  // folder's contents first does this
  async refresh() {
    if (this.folder) await this.useFolder(this.folder);
  },
  useBrowser() {
    if (this.folder) FS.umount("/folder");
    this.root = "/browser"; this.folder = null;
  },
  // every file, {name: data}, and every folder; files too big to take, by name, in `skipped`
  async load() {
    const fsp = FS.fs.promises, files = {}, skipped = [], dirs = [];
    const walk = async (rel) => {
      for (const e of await fsp.readdir(rel ? this.path(rel) : this.root, { withFileTypes: true })) {
        const name = rel ? rel + "/" + e.name : e.name;
        if (SKIP.test(name)) continue;
        if (e.isDirectory()) { dirs.push(name); await walk(name); }
        else if (!e.isFile()) continue;
        else if ((await fsp.stat(this.path(name))).size > MAX_BYTES) skipped.push(name);
        else files[name] = asData(await fsp.readFile(this.path(name)));
      }
    };
    await walk("");
    return { files, skipped, dirs };
  },
  async put(name, data) {
    const p = this.path(name);
    await FS.fs.promises.mkdir(p.slice(0, p.lastIndexOf("/")), { recursive: true });
    await FS.fs.promises.writeFile(p, data);
  },
  async remove(name) {
    await FS.fs.promises.rm(this.path(name), { force: true });
  },
  mkdir(name) {
    return FS.fs.promises.mkdir(this.path(name), { recursive: true });
  },
  // a folder, everything in it (what isn't part of the project too)
  async removeDir(name) {
    await this.refresh();
    await FS.fs.promises.rm(this.path(name), { recursive: true, force: true });
  },
  // everything under a folder, what isn't part of the project too: {files, dirs}, paths
  // relative to the project
  async everything(name) {
    await this.refresh();
    const fsp = FS.fs.promises, found = { files: [], dirs: [] };
    const walk = async (rel) => {
      for (const e of await fsp.readdir(this.path(rel), { withFileTypes: true })) {
        const p = rel + "/" + e.name;
        if (e.isDirectory()) { found.dirs.push(p); await walk(p); } else found.files.push(p);
      }
    };
    await walk(name);
    return found;
  },
  // a file or a folder to a new path: copied (everything in a folder), then the old one
  // removed, so a failure part way leaves both rather than neither
  async move(from, to) {
    await this.refresh();
    const fsp = FS.fs.promises;
    if (!(await fsp.stat(this.path(from))).isDirectory()) {
      await this.put(to, await fsp.readFile(this.path(from)));
      await this.remove(from);
      return;
    }
    const all = await this.everything(from);
    await this.mkdir(to);
    for (const d of all.dirs) await this.mkdir(to + d.slice(from.length));
    for (const f of all.files) await fsp.writeFile(this.path(to + f.slice(from.length)), await fsp.readFile(this.path(f)));
    await this.removeDir(from);
  },
  // the browser's project only: a folder on disk is never emptied
  async clear() {
    if (this.folder) throw new Error("a folder isn't cleared");
    for (const e of await FS.fs.promises.readdir(this.root)) await FS.fs.promises.rm(this.path(e), { recursive: true, force: true });
  },
};
// the open folder's handle, kept (in IndexedDB) so the next visit can open it again: at
// once if the browser kept the permission, else when the person says so
const remembered = {
  db() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open(TESTING ? "haxe-in-browser-test-folder" : "haxe-in-browser-folder", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("handles");
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async run(mode, f) {
    const db = await this.db();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("handles", mode), req = f(tx.objectStore("handles"));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  },
  get() { return this.run("readonly", (s) => s.get("folder")); },
  set(handle) { return this.run("readwrite", (s) => handle ? s.put(handle, "folder") : s.delete("folder")); },
};
// edits go to the project as they're typed (a moment after the last key), so a reload keeps them
const pendingWrites = new Map();
function keep(name) {
  clearTimeout(pendingWrites.get(name));
  pendingWrites.set(name, setTimeout(() => { pendingWrites.delete(name); if (name in files) project.put(name, files[name]); }, 400));
}
async function flushWrites(name) {
  for (const [n, t] of [...pendingWrites]) {
    if (name !== undefined && n !== name) continue;
    clearTimeout(t); pendingWrites.delete(n);
    if (n in files) await project.put(n, files[n]);
  }
}

// ---- the compiler stays resident in one worker (resident-worker.js): a build sends only
// the files that changed since the last one (and, as null, those removed), and what didn't
// change stays typed
const compiler = new Worker("resident-worker.js");
const pending = new Map();
let nextId = 1, sent = {};
compiler.onmessage = (ev) => {
  const r = ev.data;
  if (r.type === "progress") { if (activity) activity.files = r.files; return; }
  pending.get(r.id)(r); pending.delete(r.id);
};
compiler.onerror = (e) => { for (const [, resolve] of pending) resolve({ code: -2, stderr: "worker error: " + e.message, stdout: "", ms: 0 }); pending.clear(); };
function ask(msg) {
  return new Promise((resolve) => { msg.id = nextId++; pending.set(msg.id, resolve); compiler.postMessage(msg); });
}
function compile(args, sources, output) {
  const changed = {};
  for (const [k, v] of Object.entries(sources)) if (sent[k] !== v) changed[k] = sent[k] = v;
  for (const k of Object.keys(sent)) if (!(k in sources)) { changed[k] = null; delete sent[k]; }
  return ask({ type: "build", files: changed, args, output });
}

// a message to the service worker, answered on a port. Sent to the active one; if a newer
// one takes over before that answers (sw.js changed), sent again to it
function tell(msg) {
  return new Promise((resolve) => {
    let to = null;
    const send = () => {
      const ch = new MessageChannel();
      to = reg.active;
      ch.port1.onmessage = (ev) => { clearInterval(watch); resolve(ev.data); };
      to.postMessage(msg, [ch.port2]);
    };
    const watch = setInterval(() => { if (reg.active && reg.active !== to) send(); }, 250);
    send();
  });
}

async function serviceWorker() {
  reg = await navigator.serviceWorker.register("sw.js", { scope: "./run/" });
  const sw = reg.installing || reg.waiting || reg.active;
  if (sw.state !== "activated")
    await new Promise((r) => sw.addEventListener("statechange", () => sw.state === "activated" && r()));
  await tell({ type: "reset" });
}

function buildArgs(reload) {

// the same kind (kept in localStorage) says about how long and how many files: a bar from

    const last = lastBuilds[kind];
    $("progress").classList.toggle("guess", !last);
    if (last) $("progress").firstChild.style.width = 100 * Math.min(0.95, Math.max(ms / last.ms, last.files ? a.files / last.files : 0)) + "%";
  };

async function build() {
  syncEditor();
  const sources = {};
  for (const f of names()) if (isCode(f)) sources["/static/" + f] = files[f];
  const args = buildArgs(version > 0);
  // a first build starts the compiler and reads the library; after it, a whole build or a reload's
  const done = busy(compilerUp ? "building" : "starting the compiler and building", !compilerUp ? "first" : version > 0 ? "reload" : "whole");
  status("building");
  const r = await compile(args, sources, "/static/out/" + BUNDLE);
  done();
  if (r.code >= 0) compilerUp = true;
  const messages = parseMessages(r.stderr);
  showDiagnostics(messages.byFile);
  if (r.code !== 0 || !r.output) {
    status("build failed; the program keeps what it has");
    out((r.stderr || r.stdout || "no output").trim());
    return { ok: false, r };
  }
  version++;

  status(`build ${version}: ${Math.round(r.ms)} ms` + (r.startMs ? ` (+${Math.round(r.startMs)} ms to start the compiler)` : "") + (version > 1 ? ", reloading" : ""));
  out([r.stdout.trim()].concat(messages.rest).filter((x) => x).join("\n"));

}

  checkName(to);

  const first = list.length ? list[0].split("/") : [];
  const top = first.length > 1 ? first[0] + "/" : null;
  const strip = top && list.every((n) => n.startsWith(top)) ? top.length : 0;
  const safe = (n) => n && !n.startsWith("/") && !n.split("/").some((p) => p === "" || p === "." || p === "..");
  await flushWrites();
  if (project.folder) { project.useBrowser(); await remembered.set(null); }
  await project.clear();
  for (const n of list) {
    const name = n.slice(strip);
    if (safe(name) && !SKIP.test(name) && entries[n].length <= MAX_BYTES) await project.put(name, asData(entries[n]));
  }
  return switchTo(await project.load());
}
function exportZip() {
  const enc = new TextEncoder(), entries = {};
  for (const f of names()) entries[f] = isText(files[f]) ? enc.encode(files[f]) : files[f];
  return FS.zipSync(entries);
}

  const st = view && current !== null ? view.state : null, editable = !!st && !st.readOnly;
  const selected = !!st && st.selection.ranges.some((r) => !r.empty);

  const focusItem = (i) => { const all = items(); if (all.length) all[(i + all.length) % all.length].focus(); };

    else if (e.key === "Home") focusItem(0);

// ---- the page's dialog: a question (resolves to true, or null if cancelled) or, given a
// `value`, a name to type (resolves to the text). `check(text)` returns why the text won't
// do, shown under it, or nothing; `select` is the part of the value to select at first
let dialogDone = null;
function askPerson({ title, text = "", list = [], value = null, select = null, ok = "OK", danger = false, check = null }) {
  if (dialogDone) dialogDone(null);
  const d = $("dialog"), input = $("dialog-input");
  $("dialog-title").textContent = title;
  $("dialog-text").textContent = text;
  $("dialog-list").replaceChildren(...list.map((x) => { const li = document.createElement("li"); li.textContent = x; return li; }));
  $("dialog-error").textContent = "";
  $("dialog-ok").textContent = ok;
  $("dialog-ok").className = danger ? "danger" : "primary";
  input.hidden = value === null;
  input.value = value === null ? "" : value;
  input.oninput = () => { $("dialog-error").textContent = ""; };
  return new Promise((resolve) => {
    dialogDone = (answer) => { dialogDone = null; if (d.open) d.close(); resolve(answer); };
    d.querySelector("form").onsubmit = (e) => {
      if (e.submitter && e.submitter.value === "cancel") { e.preventDefault(); dialogDone(null); return; }
      e.preventDefault();
      const answer = value === null ? true : input.value.trim();
      const why = value === null || !check ? null : check(answer);
      if (why) { $("dialog-error").textContent = why; input.focus(); return; }
      dialogDone(answer);
    };
    d.oncancel = (e) => { e.preventDefault(); dialogDone(null); }; // Escape
    d.showModal();
    if (value !== null) { input.focus(); const [a, b] = select || [0, input.value.length]; input.setSelectionRange(a, b); }
    else (danger ? $("dialog-cancel") : $("dialog-ok")).focus();
  });
}

  step("a name outside the project (a build output) is refused", /wouldn't be part/.test(skipName), skipName);

  // ---- the project is kept: what the browser's store holds is what the page has
  await flushWrites();
  const kept = (await project.load()).files;
  step("the store holds the project's files", JSON.stringify(Object.keys(kept).sort()) === JSON.stringify(names()), Object.keys(kept));
  step("and their latest text", names().every((f) => kept[f] === files[f]));

  // ---- zip: out, and in (as the browser's project)
  const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const zipped = FS.unzipSync(exportZip());
  step("Export zip holds every file, as it is", JSON.stringify(Object.keys(zipped).sort()) === JSON.stringify(names())
       && names().every((f) => dec.decode(zipped[f]) === files[f]), Object.keys(zipped));
  const png = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a, 0, 0, 0, 13, 0xff, 0xfe]);
  const helloText = files["src/Hello.hx"];
  await importZip(FS.zipSync({
    "proj/src/Main.hx": enc.encode(files["src/Main.hx"]),
    "proj/src/Hello.hx": enc.encode(helloText.replace("'$greeting again, $name! (ticks", "'$greeting from the zip, $name! (ticks")),
    "proj/assets/greeting.txt": enc.encode("Ahoy\n"),
    "proj/assets/dot.png": png,
    "proj/.git/HEAD": enc.encode("ref: refs/heads/main\n"),
    "proj/out/main.js": enc.encode("// built"),
  }));
  step("Import zip: its files, its top folder taken off, hidden files and build outputs left out",
       JSON.stringify(names()) === JSON.stringify(["assets/dot.png", "assets/greeting.txt", "src/Hello.hx", "src/Main.hx"]), names());
  step("the zip's program runs", await until(() => lastTicks(frameLog(), "Ahoy from the zip"), 15000), frameLog().split("\n").slice(-2));
  step("a file that isn't text is kept as its bytes", files["assets/dot.png"] instanceof Uint8Array && same([...files["assets/dot.png"]], [...png]));
  const pngRes = await $("run").contentWindow.fetch("assets/dot.png");
  const pngServed = new Uint8Array(await pngRes.arrayBuffer());
  step("and served as them, typed", same([...pngServed], [...png]) && pngRes.headers.get("Content-Type") === "image/png", pngRes.headers.get("Content-Type"));
  show("assets/dot.png");
  step("the editor shows it and doesn't edit it", view.state.readOnly && /14 bytes/.test(view.state.doc.toString()));
  const keptBytes = (await project.load()).files["assets/dot.png"];
  step("the browser's store keeps it as bytes", keptBytes instanceof Uint8Array && same([...keptBytes], [...png]));

  // ---- a folder on this computer. A directory in the browser's private file system (OPFS)
  // stands in for one the person picks: the same kind of handle
  const opfs = await navigator.storage.getDirectory();
  await opfs.removeEntry("haxe-test-folder", { recursive: true }).catch(() => {});
  const dir = await opfs.getDirectoryHandle("haxe-test-folder", { create: true });
  const walkTo = async (path, create) => {
    const parts = path.split("/");
    let d = dir;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create });
    return [d, parts[parts.length - 1]];
  };
  const write = async (path, text) => {
    const [d, f] = await walkTo(path, true);
    const w = await (await d.getFileHandle(f, { create: true })).createWritable();
    await w.write(text); await w.close();
  };
  const read = async (path) => {
    try { const [d, f] = await walkTo(path, false); return await (await (await d.getFileHandle(f)).getFile()).text(); } catch (e) { return null; }
  };
  const isDir = async (path) => { try { await walkTo(path + "/x", false); return true; } catch (e) { return false; } };
  await write("src/Main.hx", files["src/Main.hx"]);
  await write("src/Hello.hx", helloText.replace("'$greeting again, $name! (ticks", "'$greeting from the folder, $name! (ticks"));
  await write("assets/greeting.txt", "Hey\n");
  await write("notes/readme.md", "# notes\n");
  await write(".git/HEAD", "ref: refs/heads/main\n");
  await write("out/main.js", "// built");
  // a build's many files: not part of the project, but opening the folder still walks them
  for (let i = 0; i < 300; i++) await write(`out/obj/${i}.o`, "x");
  const t1 = performance.now();
  const of = await openFolder(dir);
  report.folderOpenMs = Math.round(performance.now() - t1);
  step("Open folder: its files, without hidden files and build outputs", of.ok &&
       JSON.stringify(names()) === JSON.stringify(["assets/greeting.txt", "notes/readme.md", "src/Hello.hx", "src/Main.hx"]), names());
  step("the folder's program runs", await until(() => lastTicks(frameLog(), "Hey from the folder"), 15000), frameLog().split("\n").slice(-2));
  step("Reset is hidden for a folder", $("reset").hidden && $("folder").textContent === "Close folder");
  show("src/Hello.hx");
  files["src/Hello.hx"] = files["src/Hello.hx"].replace("from the folder", "from the disk");
  const fe = await save();
  step("an edit is written to the folder", fe.ok && /from the disk/.test(await read("src/Hello.hx") || ""));
  step("and runs", await until(() => lastTicks(frameLog(), "Hey from the disk"), 15000));
  await newFile("src/extra/Extra.hx");
  step("a new file is made in the folder", await read("src/extra/Extra.hx") === "package extra;\n\nclass Extra {\n}\n", await read("src/extra/Extra.hx"));
  await renameFile("notes/readme.md", "notes/README.md");
  step("a rename moves the file in the folder", await read("notes/README.md") === "# notes\n" && await read("notes/readme.md") === null);
  await deleteFile("src/extra/Extra.hx");
  step("a delete removes the file, and leaves its folder", await read("src/extra/Extra.hx") === null && await isDir("src/extra"));
  // a folder on disk moves with everything in it, what the page doesn't show too
  await write("src/extra/.notes", "hidden");
  await newFile("src/extra/Extra.hx");
  const fm = await movePath("src/extra", "src/more/extra");
  step("moving a folder on disk takes everything in it", fm.ok && await read("src/more/extra/Extra.hx") === "package more.extra;\n\nclass Extra {\n}\n"
       && await read("src/more/extra/.notes") === "hidden" && !(await isDir("src/extra")), await read("src/more/extra/Extra.hx"));
  await deleteFolder("src/more");
  step("deleting it removes all of it", !(await isDir("src/more")) && await read("src/more/extra/.notes") === null);
  step("what isn't part of the project is left alone", await read(".git/HEAD") === "ref: refs/heads/main\n" && await read("out/main.js") === "// built" && await read("out/obj/0.o") === "x");
  step("the folder is remembered for the next visit", await remembered.get().then((h) => h && h.isSameEntry(dir)));
  const cf = await closeFolder();
  step("Close folder: back to the browser's project (the zip's)", cf.ok && names().includes("assets/dot.png")
       && await until(() => lastTicks(frameLog(), "Ahoy from the zip"), 15000));
  step("and the folder is forgotten", await remembered.get() === undefined);
  await opfs.removeEntry("haxe-test-folder", { recursive: true });

  report.ms = Math.round(performance.now() - t0);
  report.log = frameLog().split("\n").slice(-12);
  report.ok = report.steps.every((s) => s.ok);
  await fetch("/report", { method: "POST", body: JSON.stringify(report) });
}

(async function () {
  if (!("serviceWorker" in navigator)) { status("this page needs service workers (and http://localhost or https)"); return; }
  if (!("indexedDB" in window)) { status("this page needs IndexedDB"); return; }
  applyPrefs(); // the page's theme, before anything shows
  [CM, FS] = await Promise.all([import("./vendor/codemirror.js"), import("./vendor/fs.js")]);
  slots = Object.fromEntries(Object.keys(prefParts).map((k) => [k, new CM.Compartment()]));
  await project.open();
  if (TESTING) { await project.clear(); await remembered.set(null); }
  // the folder from the last visit, if the browser still lets the page have it
  const handle = await remembered.get().catch(() => null);
  if (handle && await handle.queryPermission({ mode: "readwrite" }) === "granted") await project.useFolder(handle).catch(() => null);
  else if (handle) reopen = handle;
  let loaded = await project.load();
  if (!project.folder && Object.keys(loaded.files).length === 0) {
    // the first time (or after Reset): the example
    const listing = await (await fetch(EXAMPLE + "files.json", { cache: "no-store" })).json();
    for (const name of listing) await project.put(name, await (await fetch(EXAMPLE + name, { cache: "no-store" })).text());
    loaded = await project.load();
  }
  // the project first, so it shows while the service worker starts (a changed sw.js can
  // take a moment to take over)
  view = new CM.EditorView({ parent: $("editor") });
  showProject(loaded);
  status("starting the service worker");
  await serviceWorker();
  const first = await startProgram();
  if (loaded.skipped.length) out(`left out, over ${MAX_BYTES >> 20} MB: ${loaded.skipped.join(", ")}`);
  // a step that throws ends the test: the report says what ran, and the error
  if (TESTING && first.ok) test().catch((e) => {
    testReport.ok = false;
    testReport.error = String(e && e.stack || e);
    testReport.log = frameLog().split("\n").slice(-12);
    fetch("/report", { method: "POST", body: JSON.stringify(testReport) });
  });
})();
</script>
